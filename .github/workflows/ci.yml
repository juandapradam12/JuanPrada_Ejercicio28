name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run full analysis pipeline
        run: python run_analysis.py

      - name: Check expected artifacts
        run: |
          test -f outputs/summary.json
          test -f figures/dengue_geo_clusters.png
          test -f figures/bakery_temporal_traffic.png
          test -f figures/bakery_hourly_item_rates.png
          test -f figures/bakery_cluster_by_hour.png

  mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Open MPI and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev python3-numpy

      - name: Build and smoke-test MPI targets
        run: |
          make -C mpi all
          mpirun --allow-run-as-root -n 2 ./mpi/Listing12.7 200000
          mpirun --allow-run-as-root -n 2 ./mpi/integra 100000
